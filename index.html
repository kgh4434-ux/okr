<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKR Workspace v2 (트리 중심)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"/>
<style>
:root{--bg:#fff;--bgs:#FAFAFA;--bgh:#F4F4F5;--bgm:#F0F0F2;--bd:#E4E4E7;--bdt:#D4D4D8;--tx:#09090B;--tx2:#27272A;--tx3:#52525B;--tx4:#71717A;--tx5:#A1A1AA;--ac:#2563EB;--ach:#1D4ED8;--acbg:#EFF6FF;--s:#10B981;--sbg:#ECFDF5;--stx:#065F46;--w:#F59E0B;--wbg:#FFFBEB;--wtx:#92400E;--d:#EF4444;--dbg:#FEF2F2;--dtx:#991B1B;--ff:'Pretendard Variable',Pretendard,-apple-system,sans-serif;--fm:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:15px}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
/* Login */
.login{position:fixed;inset:0;background:#FAFAFA;display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.lc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:36px 32px;width:100%;max-width:440px;box-shadow:0 8px 24px rgba(0,0,0,.04)}
.lb{text-align:center;margin-bottom:24px}
.lb h1{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.lb p{color:var(--tx4);font-size:13px}
.lsearch{margin-bottom:10px}
.lsearch input{width:100%;height:38px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:0 14px;font-size:13px;outline:none}
.lsearch input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.lul{display:grid;gap:6px;max-height:240px;overflow-y:auto;margin-bottom:14px}
.lul-hint{font-size:11px;color:var(--tx5);text-align:center;padding:18px 0}
.lu{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--bd);border-radius:8px;cursor:pointer;transition:.12s}
.lu:hover{background:var(--bgh)}
.lu.sel{background:var(--acbg);border-color:var(--ac)}
.luav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.lun{font-size:13px;font-weight:500}
.lur{font-size:11px;color:var(--tx4);margin-top:1px}
.lutag{font-family:var(--fm);font-size:10px;color:var(--tx4);padding:2px 7px;background:var(--bgh);border-radius:4px}
.lpw input{width:100%;height:40px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:0 14px;font-size:13px;outline:none}
.lpw input:focus{border-color:var(--ac)}
.lerr{color:var(--dtx);font-size:11px;margin:8px 0 0;display:none}
.lerr.on{display:block}
.lbtn{width:100%;height:42px;background:var(--tx);color:#fff;border-radius:8px;font-weight:600;font-size:14px;margin-top:14px}
.lbtn:hover{background:#000}
.lhint{text-align:center;color:var(--tx5);font-size:11px;margin-top:10px;font-family:var(--fm)}
/* App */
.app{display:none}
.app.on{display:block}
.top{height:56px;background:#fff;border-bottom:1px solid var(--bd);padding:0 28px;display:flex;align-items:center;gap:28px;position:sticky;top:0;z-index:20}
.brand{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-right:14px}
.tabs{display:flex;gap:2px;flex:1;height:100%}
.tab{padding:0 14px;display:inline-flex;align-items:center;font-size:13px;color:var(--tx4);cursor:pointer;border-bottom:2px solid transparent;height:100%;font-weight:500;letter-spacing:-.01em}
.tab[hidden]{display:none!important}
.tab:hover{color:var(--tx2)}
.tab.on{color:var(--tx);border-bottom-color:var(--tx);font-weight:600}
.tbr{display:flex;align-items:center;gap:12px;font-family:var(--fm);font-size:11px;color:var(--tx4)}
.uav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;cursor:pointer}
main{padding:32px 36px;max-width:1400px;margin:0 auto}
[data-tab]{display:none}
[data-tab].on{display:block}
.ph{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.ph h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.ph p{color:var(--tx4);font-size:13px}
.ph-r{display:flex;gap:8px}
.btn{height:34px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;border:1px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--bdt);background:var(--bgh)}
.btnp{background:var(--tx);color:#fff;border-color:var(--tx)}
.btnp:hover{background:#000;border-color:#000}
.btn-sm{height:28px;font-size:12px;padding:0 10px}
.btn-d{color:var(--dtx);border-color:var(--bd)}
.btn-d:hover{background:var(--dbg);border-color:var(--dbd)}
/* Dashboard cards */
.kgr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kc{padding:20px 22px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.kc-l{font-size:12px;color:var(--tx4);margin-bottom:10px;font-weight:500}
.kc-v{font-family:var(--fm);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kc-v small{font-size:13px;color:var(--tx4);margin-left:4px}
.kc-d{font-size:11px;color:var(--tx4);margin-top:6px;font-family:var(--fm)}
/* Tree */
.tree{padding:8px 0}
.node{position:relative;border-left:1.5px solid var(--bd);margin-left:14px;padding-left:0}
.node.root{border-left:none;margin-left:0}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;position:relative;margin:1px 0}
.row:hover{background:var(--bgh)}
.row.sel{background:var(--acbg)}
.row.root{padding:14px 16px;background:var(--bgs);margin-bottom:6px;border:1px solid var(--bd);border-radius:10px}
.row.root.sel{border-color:var(--ac);background:var(--acbg)}
.expand{width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx4);font-size:10px;flex-shrink:0;border-radius:4px;transition:.12s}
.expand:hover{background:var(--bgm);color:var(--tx)}
.expand.open{transform:rotate(90deg)}
.expand.leaf{visibility:hidden}
.rd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:13px}
.rt b{font-weight:600}
.rid{font-family:var(--fm);font-size:11px;color:var(--tx5);font-weight:500}
.biz-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid;letter-spacing:-.01em}
.rtag{font-family:var(--fm);font-size:10px;color:var(--tx4);background:var(--bgm);padding:2px 6px;border-radius:4px}
.row.root .rt{font-size:15px;font-weight:600}
.row.lvl1 .rt{font-size:14px;font-weight:600}
.rprog{display:flex;align-items:center;gap:10px;min-width:120px;flex-shrink:0}
.rbar{width:60px;height:5px;background:var(--bgm);border-radius:99px;overflow:hidden}
.rbar-f{height:100%;background:var(--ac);border-radius:99px}
.rpct{font-family:var(--fm);font-size:12px;font-weight:600;min-width:38px;text-align:right}
.rpct.s{color:var(--stx)}.rpct.o{color:var(--ac)}.rpct.w{color:var(--wtx)}.rpct.d{color:var(--dtx)}
.rown{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);min-width:80px}
.rown .av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600;font-family:var(--fm)}
.children{margin-left:22px}
.children[hidden]{display:none}
.empty-c{padding:8px 12px;color:var(--tx5);font-size:12px;font-style:italic;margin-left:22px}
/* Business cards (Biz tab) */
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.bcard{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:22px;cursor:pointer;transition:.15s}
.bcard:hover{border-color:var(--bdt);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04)}
.bch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.bcn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.bcd{font-size:11px;color:var(--tx4);font-family:var(--fm);margin-top:4px}
.bcobj{font-size:13px;color:var(--tx2);line-height:1.5;margin-bottom:16px;padding:10px 12px;background:var(--bgs);border-radius:8px;font-style:italic}
.bcp{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.bcpv{font-family:var(--fm);font-size:32px;font-weight:700;letter-spacing:-.02em}
.bcpu{font-family:var(--fm);font-size:13px;color:var(--tx4)}
.bcpb{height:5px;background:var(--bgm);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bcpbf{height:100%;border-radius:99px;background:var(--ac)}
.bcm{font-size:12px;color:var(--tx4);display:flex;justify-content:space-between}
/* Report */
.rep{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:24px;margin-bottom:14px}
.rep h3{font-size:15px;font-weight:600;margin-bottom:14px}
.rep-r{display:grid;grid-template-columns:140px 1fr 80px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bgh)}
.rep-r:last-child{border-bottom:none}
.rep-bar{height:8px;background:var(--bgm);border-radius:99px;overflow:hidden}
.rep-bf{height:100%;border-radius:99px}
.rep-table-wrap{overflow-x:auto;margin-top:6px}
.rep-table{width:100%;border-collapse:collapse}
.rep-table th{text-align:left;padding:8px 10px;background:var(--bgs);font-weight:600;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx3);white-space:nowrap}
.rep-table td{padding:8px 10px;border-bottom:1px solid var(--bgh);vertical-align:top}
.rep-table tbody tr:hover{background:var(--bgh)}
.rep-filter{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:14px;align-items:center}
.rep-filter input[type=text]{padding:9px 12px;border:1px solid var(--bd);border-radius:7px;font-size:12px}
.rep-filter select{height:36px;padding:0 10px;border:1px solid var(--bd);border-radius:7px;font-size:12px;background:#fff}
.rep-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:4px 10px;border:1px solid var(--bd);border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;background:#fff;color:var(--tx2);transition:all .12s}
.chip:hover{border-color:var(--bdt);color:var(--tx)}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.rep-memo{font-size:11px;color:#1E40AF;background:#EFF6FF;padding:3px 8px;border-radius:5px;margin-top:4px;display:inline-block;border:1px solid #DBEAFE}
.mykr-card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .12s}
.mykr-card:hover{border-color:var(--bdt);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.mykr-card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:6px}
.mykr-card-t{font-size:14px;font-weight:500;line-height:1.55;color:var(--tx);flex:1;word-break:keep-all}
.mykr-card-r{text-align:right;white-space:nowrap;flex-shrink:0}
.mykr-card-p{font-size:20px;font-weight:700;font-family:var(--fm)}
.mykr-card-meta{font-size:11px;color:var(--tx4);margin-bottom:10px;line-height:1.5}
.mykr-card-bar{height:6px;background:var(--bgm);border-radius:99px;overflow:hidden}
.mykr-card-bar-f{height:100%;border-radius:99px;transition:width .3s}
.add-ik-row{padding:10px 14px;border:1px dashed var(--bd);border-radius:7px;margin-top:6px;text-align:center;font-size:12px;color:var(--tx4);cursor:pointer;transition:all .12s;background:var(--bgs)}
.add-ik-row:hover{border-color:var(--ac);color:var(--ac);background:var(--acbg)}
.pct-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-family:var(--fm);font-size:11px;font-weight:600;margin-left:6px}
.pct-badge.over{background:#DBEAFE;color:#1E40AF}
.pct-badge.ok{background:var(--sbg);color:var(--stx)}
.pct-badge.warn{background:var(--wbg);color:var(--wtx)}
.pct-badge.risk{background:var(--dbg);color:var(--dtx)}
.pct-color.over{color:#1E40AF}
.pct-color.ok{color:var(--stx)}
.pct-color.warn{color:var(--wtx)}
.pct-color.risk{color:var(--dtx)}
.pct-badge.none{background:#F3F4F6;color:#6B7280}
.pct-color.none{color:#6B7280}
.kc-meter-f.none{background:#9CA3AF}
.pct-badge.idle{background:#E0E7FF;color:#3730A3}
.pct-color.idle{color:#3730A3}
.kc-meter-f.idle{background:#818CF8}
.trend{display:inline-flex;align-items:center;gap:2px;font-family:var(--fm);font-size:11px;color:var(--tx4);margin-left:4px}
.trend.up{color:var(--stx)}
.trend.down{color:var(--dtx)}
.kr-flag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-family:var(--fm);font-size:10px;font-weight:600;margin-left:6px;white-space:nowrap}
.kr-flag.pending{background:#FEF3C7;color:#92400E}
.kr-flag.health{background:#DBEAFE;color:#1E40AF}
.kr-flag.link{background:#E0E7FF;color:#3730A3}
.kr-flag.wait{background:#F3F4F6;color:#374151}
.rid{display:none}
.owner-picker{border:1px solid var(--bd);border-radius:6px;padding:6px;background:var(--bgs);min-height:40px}
.owner-chips{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.owner-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid}
.owner-chip .x{cursor:pointer;font-weight:700;padding:0 2px;opacity:.6}
.owner-chip .x:hover{opacity:1}
.owner-picker input{width:100%;border:none;background:transparent;outline:none;padding:4px 6px;font-size:12px;border-top:1px solid var(--bd);margin-top:4px}
.owner-options{max-height:140px;overflow-y:auto;margin-top:2px}
.owner-opt{padding:6px 10px;font-size:12px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:6px}
.owner-opt:hover{background:var(--bgh)}
.owner-opt .g-mark{font-size:10px;background:#F3F4F6;color:#52525B;padding:1px 5px;border-radius:99px;font-weight:600}
.wait-note{font-size:11px;color:var(--wtx);background:var(--wbg);border:1px dashed #FDE68A;border-radius:6px;padding:6px 10px;margin-top:8px}
/* Dashboard 카드 강화 */
.kc{position:relative;overflow:hidden}
.kc-v{font-size:42px}
.kc-meter{height:6px;background:var(--bgm);border-radius:99px;overflow:hidden;margin-top:10px}
.kc-meter-f{height:100%;background:var(--ac);border-radius:99px}
.kc-meter-f.over{background:#1E40AF}
.kc-meter-f.ok{background:var(--s)}
.kc-meter-f.warn{background:var(--w)}
.kc-meter-f.risk{background:var(--d)}
.kc-badge-row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
/* 비밀번호 변경 모달 */
.modal{position:fixed;inset:0;background:rgba(9,9,11,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.modal.on{display:flex}
.modal-c{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-h{font-size:17px;font-weight:600;margin-bottom:14px;letter-spacing:-.01em}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal input{width:100%;height:38px;border:1px solid var(--bd);border-radius:8px;padding:0 12px;font-size:13px;outline:none;margin-bottom:10px}
.modal input:focus{border-color:var(--ac)}
.src-tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:4px;font-family:var(--fm);font-size:9px;font-weight:600;margin-left:5px;letter-spacing:.02em}
.src-tag.dummy{background:#F3F4F6;color:#71717A;border:1px solid #E4E4E7}
.src-tag.real{background:#DBEAFE;color:#1E40AF;border:1px solid #BFDBFE}
.src-tag.unset{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
/* Org shapes */
.org-shapes{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}
.org-shape{padding:18px 22px;border:2px solid var(--bd);border-radius:14px;cursor:pointer;background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;transition:.15s;position:relative}
.org-shape:hover{border-color:var(--bdt);transform:translateY(-1px)}
.org-shape.on{border-color:var(--ac);background:var(--acbg)}
.org-shape-c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;margin-bottom:4px}
.org-shape-n{font-size:14px;font-weight:600}
.org-shape-l{font-family:var(--fm);font-size:11px;color:var(--tx4)}
.org-shape-cnt{position:absolute;top:8px;right:10px;font-family:var(--fm);font-size:10px;background:var(--bgm);padding:2px 7px;border-radius:99px;color:var(--tx3);font-weight:500}
.org-shape.all{background:var(--tx);border-color:var(--tx)}
.org-shape.all .org-shape-n,.org-shape.all .org-shape-l{color:#fff}
.org-shape.all .org-shape-cnt{background:rgba(255,255,255,.2);color:#fff}
/* User table */
.utbl{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.uth{display:grid;grid-template-columns:36px 1fr 1fr 110px 110px 50px;gap:14px;padding:12px 18px;background:var(--bgs);font-family:var(--fm);font-size:10px;color:var(--tx4);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--bd)}
.urow{display:grid;grid-template-columns:36px 1fr 1fr 110px 110px 50px;gap:14px;padding:13px 18px;border-bottom:1px solid var(--bgh);align-items:center;font-size:13px}
.urow:last-child{border-bottom:none}
.urow:hover{background:var(--bgs)}
.uavn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px}
.usub{font-size:11px;color:var(--tx4);margin-top:2px}
.urtag{font-family:var(--fm);font-size:11px;color:var(--tx3);padding:3px 8px;background:var(--bgm);border-radius:5px}
/* Setting */
.sgrp{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:22px;margin-bottom:14px}
.sgrp h3{font-size:15px;font-weight:600;margin-bottom:4px}
.sgrp .desc{font-size:12px;color:var(--tx4);margin-bottom:14px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bgh);font-size:13px}
.srow:last-child{border-bottom:none}
.srow label{font-weight:500}
.srow .sub{font-size:11px;color:var(--tx4);margin-top:2px}
.srow select,.srow input{height:32px;border:1px solid var(--bd);border-radius:6px;padding:0 10px;font-size:12px;background:#fff;outline:none;min-width:180px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(9,9,11,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.mc{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 48px rgba(0,0,0,.18)}
.mh{padding:22px 26px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.mh .sub{font-family:var(--fm);font-size:11px;color:var(--tx4);margin-top:3px}

function sparkline(id){const h=(state.history[id]||[]);const k=KRS[id];if(!k||h.length<1)return '';let pts=[h[0].cur];h.forEach(x=>pts.push(x.newCur));if(pts.length<2)return '';const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1,W=240,H=44,n=pts.length;const c=k.biz&&COLORS[k.biz]?COLORS[k.biz]:'#3B82F6';const xy=pts.map((v,i)=>{const x=Math.round(i/(n-1)*(W-8))+4;const y=Math.round(H-4-((v-mn)/rg)*(H-8));return x+','+y;});const L=xy[xy.length-1].split(',');return `<div style="background:var(--bgs);border-radius:6px;padding:8px 10px;margin-bottom:6px"><svg width="${W}" height="${H}" style="display:block;overflow:visible"><polyline points="${xy.join(' ')}" fill="none" stroke="${c}" stroke-width="2"/><circle cx="${L[0]}" cy="${L[1]}" r="3" fill="${c}"/></svg><div style="font-size:10px;color:var(--tx4);margin-top:2px">체크인 추이 (${n}개 시점)</div></div>`;}
function grabForm(){const k=KRS[state.currentKr];if(!k)return;const t=document.getElementById('krT');if(t&&!t.disabled)k.text=t.value;const n=document.getElementById('krNote');if(n&&!n.disabled)k.note=n.value;const pp=document.getElementById('krPeriod');if(pp&&!pp.disabled)k.period=pp.value;[['',k],['2',k.m2]].forEach(([pfx,o])=>{if(!o||!o.steps)return;[...document.querySelectorAll('#mKr input[type=text]')].forEach(el=>{const oc=el.getAttribute('onchange')||'';const mm=oc.match(/^stepLabel\((\d+),'([^']*)'/);if(mm&&mm[2]===pfx&&o.steps[+mm[1]])o.steps[+mm[1]].label=el.value;});});}
function mBlock(o,ed,p){const m=o.measure||'number';const dis=ed?'':'disabled';let f='';
if(m==='done'){const v=o.done===true?'y':(o.done===false?'n':'');f=`<div class="fg"><label>완료 여부</label><select id="krDone${p}" ${dis} onchange="setDone(this.value,'${p}')"><option value="" ${v===''?'selected':''}>미입력</option><option value="y" ${v==='y'?'selected':''}>✅ 완료 (100%)</option><option value="n" ${v==='n'?'selected':''}>⬜ 미완료 (0%)</option></select></div>`;}
else if(m==='steps'){const st=o.steps||[];const rows=st.map((x,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px"><input type="checkbox" ${x.done?'checked':''} ${dis} onchange="stepToggle(${i},this.checked,'${p}')"><input type="text" value="${(x.label||'').replace(/"/g,'&quot;')}" ${dis} onchange="stepLabel(${i},this.value,'${p}')" style="flex:1;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px">${ed?`<span onclick="stepDel(${i},'${p}')" style="cursor:pointer;color:var(--tx5)">✕</span>`:''}</div>`).join('');f=`<div class="fg"><label>단계 (완료 ${st.filter(x=>x.done).length}/${st.length} · ${st.length?Math.round(st.filter(x=>x.done).length/st.length*100):0}%)</label>${rows||'<div style="font-size:11px;color:var(--tx5)">단계 없음</div>'}${ed?`<div onclick="stepAdd('${p}')" style="cursor:pointer;color:var(--ac);font-size:12px;margin-top:4px">+ 단계 추가</div>`:''}</div>`;}
else if(m==='rating'){const v=o.rating==null?0:o.rating;f=`<div class="fg"><label>정성 평가: <b id="krRateV${p}">${o.rating==null?'미입력':v+'%'}</b></label><input type="range" min="0" max="100" step="5" id="krRate${p}" value="${v}" ${dis} oninput="var e=document.getElementById('krRateV${p}');if(e)e.textContent=this.value+'%'" style="width:100%"></div>`;}
else{f=`<div class="fg" style="display:grid;grid-template-columns:1fr 1fr 1fr 0.7fr;gap:8px"><div><label>시작값</label><input type="number" step="any" id="krBl${p}" value="${o.baseline??0}" ${dis}></div><div><label>현재값</label><input type="number" step="any" id="krC${p}" value="${o.cur??0}" ${dis}></div><div><label>목표값</label><input type="number" step="any" id="krTg${p}" value="${o.tgt??1}" ${dis}></div><div><label>단위</label><input type="text" id="krU${p}" value="${o.unit||''}" ${dis}></div></div>`;}
return `<div class="fg"><label>측정 방식${p==='2'?' ②':' ①'}</label><select id="krMeasure${p}" ${dis} onchange="setMeasure(this.value,'${p}')">${[['number','숫자형 (시작→목표)'],['done','완료/미완료'],['steps','단계형(체크리스트)'],['rating','정성형(0~100)']].map(([v,t])=>`<option value="${v}" ${(o.measure||'number')===v?'selected':''}>${t}</option>`).join('')}</select></div>${f}`;}
function measureUI(k,ed){return `${mBlock(k,ed,'')}${k.m2?`<div style="border-top:1px dashed var(--bd);margin:12px 0 6px"></div>${mBlock(k.m2,ed,'2')}${ed?`<div onclick="delM2()" style="cursor:pointer;color:var(--dtx);font-size:11px;margin-top:2px">— 두 번째 측정 제거</div>`:''}<div class="fg" style="background:#EFF6FF;border-radius:8px;padding:8px 12px;margin-top:6px"><b>종합 달성률: ${pct(k)<0?'미입력':pct(k)+'%'}</b> <span style="font-size:11px;color:#1D4ED8">· 두 측정의 평균</span></div>`:`${ed?`<div onclick="addM2()" style="cursor:pointer;color:var(--ac);font-size:12px;margin-top:6px">+ 측정 방식 추가 (최대 2개)</div>`:''}`}`;}
function tgtObj(p){const k=KRS[state.currentKr];if(p==='2'){if(!k.m2)k.m2={measure:'number',baseline:0,cur:0,tgt:100,unit:'%'};return k.m2;}return k;}
function addM2(){grabForm();const k=KRS[state.currentKr];k.m2={measure:'number',baseline:0,cur:0,tgt:100,unit:'%'};openKr(state.currentKr);}
function delM2(){grabForm();const k=KRS[state.currentKr];delete k.m2;openKr(state.currentKr);}
function readBlock(o,p){const g=id=>document.getElementById(id+p);const ms=g('krMeasure');if(ms)o.measure=ms.value;const m=o.measure||'number';if(m==='number'){const a=g('krBl'),b=g('krC'),c=g('krTg'),d=g('krU');if(a)o.baseline=parseFloat(a.value)||0;if(b)o.cur=parseFloat(b.value)||0;if(c)o.tgt=parseFloat(c.value)||1;if(d)o.unit=d.value;}else if(m==='done'){const dv=g('krDone');if(dv)o.done=dv.value==='y'?true:(dv.value==='n'?false:undefined);}else if(m==='rating'){const r=g('krRate');if(r)o.rating=parseInt(r.value);}}
function measureFields(k,ed){const m=k.measure||'number';const dis=ed?'':'disabled';
if(m==='done'){const v=k.done===true?'y':(k.done===false?'n':'');return `<div class="fg"><label>완료 여부</label><select id="krDone" ${dis} onchange="setDone(this.value)"><option value="" ${v===''?'selected':''}>미입력</option><option value="y" ${v==='y'?'selected':''}>✅ 완료 (100%)</option><option value="n" ${v==='n'?'selected':''}>⬜ 미완료 (0%)</option></select></div>`;}
if(m==='steps'){const st=k.steps||[];const rows=st.map((x,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px"><input type="checkbox" ${x.done?'checked':''} ${dis} onchange="stepToggle(${i},this.checked)"><input type="text" value="${(x.label||'').replace(/"/g,'&quot;')}" ${dis} onchange="stepLabel(${i},this.value)" style="flex:1;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px">${ed?`<span onclick="stepDel(${i})" style="cursor:pointer;color:var(--tx5)">✕</span>`:''}</div>`).join('');return `<div class="fg"><label>단계 (완료 ${st.filter(x=>x.done).length}/${st.length} · ${st.length?Math.round(st.filter(x=>x.done).length/st.length*100):0}%)</label>${rows||'<div style="font-size:11px;color:var(--tx5)">단계 없음</div>'}${ed?`<div onclick="stepAdd()" style="cursor:pointer;color:var(--ac);font-size:12px;margin-top:4px">+ 단계 추가</div>`:''}</div>`;}
if(m==='rating'){const v=k.rating==null?0:k.rating;return `<div class="fg"><label>정성 평가: <b id="krRateV">${k.rating==null?'미입력':v+'%'}</b></label><input type="range" min="0" max="100" step="5" id="krRate" value="${v}" ${dis} oninput="var e=document.getElementById('krRateV');if(e)e.textContent=this.value+'%'" style="width:100%"></div>`;}
return `<div class="fg" style="display:grid;grid-template-columns:1fr 1fr 1fr 0.7fr;gap:8px"><div><label>시작값 (baseline)</label><input type="number" step="any" id="krBl" value="${k.baseline??0}" ${dis}></div><div><label>현재값</label><input type="number" step="any" id="krC" value="${k.cur}" ${dis}></div><div><label>목표값</label><input type="number" step="any" id="krTg" value="${k.tgt}" ${dis}></div><div><label>단위</label><input type="text" id="krU" value="${k.unit||''}" ${dis}></div></div>`;}
function setMeasure(m,p){grabForm();tgtObj(p).measure=m;openKr(state.currentKr);}
function setDone(v,p){grabForm();tgtObj(p).done=v==='y'?true:(v==='n'?false:undefined);openKr(state.currentKr);}
function stepAdd(p){grabForm();const o=tgtObj(p);if(!o.steps)o.steps=[];o.steps.push({label:'새 단계',done:false});openKr(state.currentKr);}
function stepToggle(i,v,p){grabForm();const o=tgtObj(p);if(o.steps&&o.steps[i]){o.steps[i].done=v;openKr(state.currentKr);}}
function stepLabel(i,v,p){const o=tgtObj(p);if(o.steps&&o.steps[i])o.steps[i].label=v;}
function stepDel(i,p){grabForm();const o=tgtObj(p);if(o.steps){o.steps.splice(i,1);openKr(state.currentKr);}}

/* ===== 하위 업무(Task) — 업무 1건 = 문서 1개 (동시편집 안전) ===== */
let TASKS={},TCOL=null,_tsubbed=false,_taskKr=null;

let _tDirty=new Set(),_tDel=new Set();
function tDirtyCnt(){return _tDirty.size+_tDel.size}
function updSaveBar(){const b=document.getElementById('tSaveBtn');const m=document.getElementById('tSaveMsg');const n=tDirtyCnt();
 if(b){b.disabled=!n;b.style.opacity=n?'1':'.45';b.textContent=n?('저장 ('+n+')'):'저장'}
 if(m)m.textContent=n?('저장되지 않은 변경 '+n+'건 — [저장]을 눌러야 반영됩니다'):'모든 변경이 저장되었습니다'}
function saveTasks(){if(!TCOL){alert('연결 상태를 확인해주세요.');return}
 let empty=0;
 [..._tDirty].forEach(id=>{const t=TASKS[id];if(t&&!(t.t||'').trim()){delete TASKS[id];_tDirty.delete(id);if(!t._new)_tDel.add(id);empty++}});
 const w=[];const doneNow=[];
 _tDirty.forEach(id=>{const t=TASKS[id];if(!t)return;const o=Object.assign({},t);delete o._new;delete o._logged;w.push(TCOL.doc(id).set(o));if(t.st==='done'&&!t._logged){t._logged=1;doneNow.push(t)}});
 _tDel.forEach(id=>{w.push(TCOL.doc(id).delete())});
 Promise.all(w).then(()=>{doneNow.forEach(t=>logAct(t.kr,'task',{txt:'업무 완료 — '+(t.t||'제목 없음')}));
  _tDirty.clear();_tDel.clear();rTaskBody();
  const m=document.getElementById('tSaveMsg');if(m)m.textContent=empty?('저장했습니다 · 내용이 비어 있던 '+empty+'줄은 저장하지 않았습니다'):'저장했습니다';
 }).catch(e=>{console.warn('task save',e);alert('저장에 실패했습니다. 잠시 후 다시 시도해주세요.')})}
function discardTasks(){_tDirty.forEach(id=>{if(TASKS[id]&&TASKS[id]._new)delete TASKS[id]});_tDirty.clear();_tDel.clear();rTaskBody()}
function tSub(){if(!TCOL||_tsubbed)return;_tsubbed=true;TCOL.where('_k','==','task').onSnapshot(qs=>{const n={};qs.forEach(d=>{n[d.id]=d.data()});_tDirty.forEach(id=>{if(TASKS[id])n[id]=TASKS[id]});_tDel.forEach(id=>{delete n[id]});TASKS=n;const m=document.getElementById('mTask');if(m&&!m.hidden)rTaskBody();try{if(state.cu)go(location.hash.replace('#','')||'dash')}catch(e){}},e=>console.warn('task snap',e));}
function tid(){return 't_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tWrite(id,o){if(!TCOL)return;TCOL.doc(id).set(o).catch(e=>console.warn('task write',e))}
function krTasks(krId){return Object.entries(TASKS).filter(([,t])=>t&&t.kr===krId).sort((a,b)=>(a[1].ord||0)-(b[1].ord||0))}
function canEditTask(krId){return canEditMemo(krId)}
function tcols(krId){return (KRS[krId]&&KRS[krId].tcols)||[]}
function taskBadge(krId){const n=krTasks(krId).length;const d=krTasks(krId).filter(([,t])=>t.st==='done').length;return n?`<span class="tbadge" onclick="event.stopPropagation();openTasks('${krId}')">업무 ${d}/${n}</span>`:`<span class="tbadge z" onclick="event.stopPropagation();openTasks('${krId}')">업무 +</span>`}
function taskEntryHtml(krId){const n=krTasks(krId).length;return `<div class="fg"><label>하위 업무 (실무 관리)</label><button class="btn" style="width:100%;justify-content:center" onclick="openTasks('${krId}')">업무 관리 열기 &middot; ${n}건</button></div>`}
function addTask(krId){const id=tid();const me=uById(state.cu);const rs=krTasks(krId);const ord=(rs.length?rs[rs.length-1][1].ord||0:0)+10;const o={_k:'task',kr:krId,t:'',ow:state.cu||'',due:'',st:'todo',memo:'',c:{},ord,ua:Date.now(),ub:me&&me.name||'-',_new:1};TASKS[id]=o;_tDirty.add(id);rTaskBody()}
function setT(id,f,v){const t=TASKS[id];if(!t)return;const me=uById(state.cu);const o=Object.assign({},t,{_k:'task',[f]:v,ua:Date.now(),ub:me&&me.name||'-'});TASKS[id]=o;_tDirty.add(id);if(f==='st')rTaskBody();else updSaveBar()}
function setTC(id,k,v){const t=TASKS[id];if(!t)return;const me=uById(state.cu);const c=Object.assign({},t.c||{});c[k]=v;const o=Object.assign({},t,{_k:'task',c,ua:Date.now(),ub:me&&me.name||'-'});TASKS[id]=o;_tDirty.add(id);updSaveBar()}
function rmTask(id){const t=TASKS[id];if(!t)return;if((t.t||'').trim()&&!confirm('이 업무를 삭제할까요?'))return;if(!t._new)_tDel.add(id);_tDirty.delete(id);delete TASKS[id];rTaskBody()}
function addCol(krId){const l=prompt('추가할 열 이름을 입력하세요 (예: 광고주명, 계약금액)');if(!l||!l.trim())return;const ty=confirm('숫자만 입력하는 열입니까?\n확인 = 숫자 / 취소 = 텍스트')?'num':'text';const c=tcols(krId).slice();c.push({k:'c'+Date.now().toString(36),l:l.trim(),ty});KRS[krId].tcols=c;saveS();cloudKrWrite({[krId]:KRS[krId]});rTaskBody()}
function delCol(krId,k){if(!confirm('이 열을 삭제할까요? 입력된 값도 함께 사라집니다.'))return;KRS[krId].tcols=tcols(krId).filter(c=>c.k!==k);saveS();cloudKrWrite({[krId]:KRS[krId]});rTaskBody()}
function openTasks(krId){const k=KRS[krId];if(!k)return;_taskKr=krId;document.getElementById('mtT').textContent=k.text;document.getElementById('mtS').textContent=krId+' · 하위 업무';document.getElementById('mTask').hidden=false;rTaskBody()}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function rTaskBody(){const krId=_taskKr;if(!krId)return;const ed=canEditTask(krId);const cols=tcols(krId);const rows=krTasks(krId);const ST={todo:'대기',doing:'진행',done:'완료'};
const done=rows.filter(([,t])=>t.st==='done').length;
let h='';
h+=`<div class="tbar">${ed?`<button class="btn btnp" onclick="addTask('${krId}')">+ 업무 추가</button><button class="btn" onclick="addCol('${krId}')">+ 열 추가</button>`:'<span style="font-size:12px;color:var(--wtx);background:var(--wbg);border:1px solid #FDE68A;border-radius:7px;padding:6px 11px">담당자·관리자만 편집할 수 있습니다 — 조회만 가능</span>'}<span style="margin-left:auto;font-size:11px;color:var(--tx4);font-family:var(--fm)">${rows.length}건 · 완료 ${done}건</span></div>`;
h+='<div class="ttw"><table class="tt"><thead><tr><th style="width:26px"></th><th style="min-width:200px">업무</th><th style="width:100px">담당</th><th style="width:126px">기한</th><th style="width:84px">상태</th>';
cols.forEach(c=>{h+=`<th>${esc(c.l)}${ed?`<span class="cx" onclick="delCol('${krId}','${c.k}')">&times;</span>`:''}</th>`});
h+='<th style="min-width:130px">비고</th>'+(ed?'<th style="width:32px"></th>':'')+'</tr></thead><tbody>';
if(!rows.length){h+=`<tr><td colspan="${6+cols.length+(ed?1:0)}" style="text-align:center;color:var(--tx5);padding:28px">등록된 업무가 없습니다${ed?' — [+ 업무 추가]를 눌러 시작하세요':''}</td></tr>`}
rows.forEach(([id,t],i)=>{
 h+=`<tr class="${t.st==='done'?'done':''}"><td class="no">${i+1}</td>`;
 h+=`<td><input data-t="1" value="${esc(t.t)}" ${ed?'':'disabled'} onchange="setT('${id}','t',this.value)" placeholder="업무 내용"></td>`;
 h+=`<td><select ${ed?'':'disabled'} onchange="setT('${id}','ow',this.value)"><option value="">-</option>${USERS.map(u=>`<option value="${u.id}" ${t.ow===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></td>`;
 h+=`<td><input type="date" value="${esc(t.due)}" ${ed?'':'disabled'} onchange="setT('${id}','due',this.value)"></td>`;
 h+=`<td><select class="st ${t.st}" ${ed?'':'disabled'} onchange="setT('${id}','st',this.value)">${Object.keys(ST).map(v=>`<option value="${v}" ${t.st===v?'selected':''}>${ST[v]}</option>`).join('')}</select></td>`;
 cols.forEach(c=>{h+=`<td><input ${c.ty==='num'?'type="number"':''} value="${esc((t.c||{})[c.k])}" ${ed?'':'disabled'} onchange="setTC('${id}','${c.k}',this.value)"></td>`});
 h+=`<td><input value="${esc(t.memo)}" ${ed?'':'disabled'} onchange="setT('${id}','memo',this.value)" placeholder="비고"></td>`;
 if(ed)h+=`<td><span class="rx" onclick="rmTask('${id}')">&times;</span></td>`;
 h+='</tr>';
});
h+='</tbody></table></div>';
const last=rows.map(([,t])=>t).sort((a,b)=>(b.ua||0)-(a.ua||0))[0];
h+=`<div class="tft"><span id="tSaveMsg">${tDirtyCnt()?'저장되지 않은 변경 '+tDirtyCnt()+'건 — [저장]을 눌러야 반영됩니다':(last?'마지막 저장 '+new Date(last.ua).toLocaleString('ko-KR')+' · '+esc(last.ub):'&nbsp;')}</span><span style="float:right">이 표는 참고용입니다 — KR 진척률에 자동 반영되지 않습니다.</span></div>`;
document.getElementById('mtB').innerHTML=h;updSaveBar()}


/* ===== 일정(마감일) · 활동 · 코멘트 · 확신도 ===== */
const D0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function dnum(v){if(!v)return null;const d=new Date(v+'T00:00:00');return isNaN(d)?null:d}
function dleft(v){const d=dnum(v);return d===null?null:Math.round((d-D0())/86400000)}
function lastAct(id){let t=0;(state.history&&state.history[id]||[]).forEach(h=>{const d=new Date(String(h.at).replace(' ','T'));if(!isNaN(d))t=Math.max(t,d.getTime())});Object.values(ACTS).forEach(a=>{if(a&&a.kr===id)t=Math.max(t,a.at||0)});Object.values(TASKS).forEach(x=>{if(x&&x.kr===id)t=Math.max(t,x.ua||0)});return t||null}
function krState(id){const k=KRS[id];if(!k)return 'none';const dl=dleft(k.due);if(dl===null)return 'none';const p=pct(k);if(dl<0&&p<100)return 'late';if(dl<=7)return 'soon';const la=lastAct(id);if(!la||(Date.now()-la)/86400000>=14)return 'idle';return 'ok'}
function ddBadge(id){const k=KRS[id];if(!k)return '';if(!k.due)return '<span class="dd none">기한 미설정</span>';const dl=dleft(k.due);const st=krState(id);if(st==='late')return `<span class="dd late">지연 ${-dl}일</span>`;if(st==='idle')return `<span class="dd idle">정체</span>`;if(dl<=7)return `<span class="dd soon">D-${dl}</span>`;return `<span class="dd ok">D-${dl}</span>`}
/* 확신도 */
function confUI(id){const k=KRS[id];const c=k.conf||'';const ed=canEditMemo(id);return `<div class="sig">${[['g','순조'],['y','주의'],['r','위험']].map(([v,l])=>`<div class="s ${v} ${c===v?'on':''}" ${ed?`onclick="setConf('${id}','${v}')"`:''}>${l}</div>`).join('')}</div>`}
function setConf(id,v){const k=KRS[id];if(!k||!canEditMemo(id))return;const L={g:'순조',y:'주의',r:'위험'};const old=k.conf||'';if(old===v)return;k.conf=v;saveS();cloudKrWrite({[id]:k});logAct(id,'conf',{from:L[old]||'미설정',to:L[v]});openKr(id)}

function logAct(kr,ty,o){if(!TCOL)return;const me=uById(state.cu);const id='a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const doc=Object.assign({_k:'act',kr:kr||'',ty:ty,by:(me&&me.name)||'-',byId:state.cu||'',at:Date.now()},o||{});ACTS[id]=doc;TCOL.doc(id).set(doc).catch(e=>console.warn('act write',e))}

const sec=(t,arr,cls)=>arr.length?`<div class="wsec ${cls}">${t}<span class="cnt">${arr.length}</span></div>${arr.map(row).join('')}`:'';
return `<div class="ph"><div><h1>내 업무</h1><p>담당 ${mine.length}건 · 마감일과 최근 업데이트를 기준으로 자동 분류됩니다</p></div></div>${mine.length?'':'<div class="empty2">담당으로 지정된 KR이 없습니다.</div>'}${sec('지연 — 마감일이 지났습니다',G.late,'late')}${sec('이번 주 마감 (7일 이내)',G.soon,'soon')}${sec('정체 — 14일 이상 변화 없음',G.idle,'idle')}${sec('정상',G.ok,'ok')}${sec('기한 미설정',G.none,'none')}<div class="wnote"><b>분류 기준 (자동)</b><br>지연 = 마감일 경과 &amp; 미완료 · 이번 주 = 마감 7일 이내 · 정체 = 14일 이상 값·메모·업무 변화 없음 · 기한 미설정 = 마감일 미입력<br>마감일은 KR을 열어 <b>마감일</b> 칸에 날짜를 넣으면 설정됩니다.</div><div style="margin-top:26px;border-top:1px solid var(--bd);padding-top:18px">${rMyKr()}</div>`}

function actLine(a){const k=KRS[a.kr];const kt=k?esc(k.text):'(삭제된 KR)';const kr=`<span class="kr" onclick="openKr('${a.kr}')">${kt}</span>${KRS[a.kr]?progBadge(a.kr):''}`;const mk=mentIsMine(a);

function addProgLog(){const id=_progKr;if(!id||!canEditMemo(id))return;const k=KRS[id];
 const memo=(document.getElementById('pgMemo')||{}).value||'';const raw=(document.getElementById('pgVal')||{}).value||'';
 if(!memo.trim()){alert('진행 내용을 입력해주세요.');return}
 const oldCur=k.cur;let newCur=oldCur;
 if(raw!==''&&!isNaN(Number(raw))){newCur=Number(raw);k.cur=newCur}
 if(_progConf)k.conf=_progConf;
 const me=uById(state.cu);
 if(!state.history[id])state.history[id]=[];
 state.history[id].push({at:nowStamp(),cur:oldCur,newCur:newCur,by:(me&&me.name)||'-',memo:memo});
 saveS();cloudKrWrite({[id]:KRS[id]},null,{['_history.'+id]:state.history[id]});
 const ment=parseMent(memo);logAct(id,'log',{from:String(oldCur),to:String(newCur),txt:memo,conf:_progConf||'',ment:ment});
 _progConf='';
 setTimeout(()=>{rProg();try{go(location.hash.replace('#','')||'dash')}catch(e){}},500)}

 evs.forEach(([,a])=>{t+='· '+new Date(a.at).toLocaleDateString('ko-KR')+' '+a.by+' — '+((a.ty==='log'||a.ty==='val')?(a.from+'→'+a.to+' ') :'')+(a.txt||'')+'\n'});

function mentTargets(){const out=[];
 Object.entries(TEAMS).forEach(([id,t])=>out.push({id:id,name:t.name,type:'team',color:t.color,sub:((t.members||[]).length)+'명'}));
 Object.entries(BIZ).forEach(([id,b])=>out.push({id:'b_'+id,name:b.name,type:'biz',color:(typeof COLORS!=='undefined'&&COLORS[id])||'#0F766E',sub:USERS.filter(u=>getUserBus(u).includes(b.bu)).length+'명'}));
 USERS.forEach(u=>out.push({id:u.id,name:u.name,type:'user',color:u.color,sub:u.title||''}));
 return out}
function mentByName(n){return mentTargets().find(t=>t.name===n)||null}
function mentHtml(t){const list=mentTargets().slice().sort((a,b)=>b.name.length-a.name.length);
 let h=esc(t);
 list.forEach(o=>{const key='@'+esc(o.name);if(h.indexOf(key)<0)return;
  const cls=o.type==='user'?'p':o.type==='team'?'t':'o';
  h=h.split(key).join('<span class="mn '+cls+'">@'+esc(o.name)+'</span>')});
 return h}
function parseMent(t){const ids=[];mentTargets().forEach(o=>{if(t.indexOf('@'+o.name)>=0)ids.push(o.id)});return ids}
function mentExpand(ids){const out=new Set();(ids||[]).forEach(id=>{
 if(String(id).startsWith('g_')){((TEAMS[id]||{}).members||[]).forEach(u=>out.add(u))}
 else if(String(id).startsWith('b_')){const b=BIZ[id.slice(2)];if(b)USERS.forEach(u=>{if(getUserBus(u).includes(b.bu))out.add(u.id)})}
 else out.add(id)});return [...out]}

${measureUI(k,ed)}
<div class="fg" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>타입</label><select id="krTy" ${!ed?'disabled':''}><option value="committed" ${k.type==='committed'?'selected':''}>필수 (committed)</option><option value="aspirational" ${k.type==='aspirational'?'selected':''}>도전 (aspirational)</option></select></div><div><label>담당자 (그룹 1 + 개인 N)</label><div class="owner-picker"><div class="owner-chips" id="krOChips"></div>${ed?'<input type="text" id="krOSearch" placeholder="이름/그룹 검색..." oninput="renderKrOpts()" onfocus="renderKrOpts()"><div class="owner-options" id="krOOpts"></div>':''}</div></div></div>
<div class="fg"><label>세부 메모</label><textarea id="krNote" rows="4" ${!(ed||em)?'disabled':''} style="width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:12px;font-family:inherit;line-height:1.6;resize:vertical;background:${!(ed||em)?'var(--bgs)':'#fff'};color:var(--tx2)">${(k.note||'').replace(/"/g,'&quot;')}</textarea></div><div class="fg" style="display:grid;grid-template-columns:1fr 1fr 104px;gap:8px"><div><label>시작일</label><input type="date" id="krStart" value="${k.start||''}" ${!ed?'disabled':''}></div><div><label>마감일</label><input type="date" id="krDue" value="${k.due||''}" ${!ed?'disabled':''}></div><div><label>자동 계산</label><div style="padding-top:7px">${ddBadge(id)}</div></div></div>${k.period?`<div class="fg"><label>실행 기간 (예전 입력값 · 참고용)</label><input type="text" id="krPeriod" value="${(k.period||'').replace(/"/g,'&quot;')}" ${!ed?'disabled':''}></div>`:''}`+progEntryHtml(id);
state.krOwners=[...getOwners(k)];renderKrChips();if(ed){renderKrOpts()}if($('#krMemo'))$('#krMemo').value='';$('#mKr').hidden=false}
function saveKr(){const id=state.currentKr;const k=KRS[id];if(!k)return;let _dueChg=null;const _full=canEdit(id);const _memoOnly=!_full&&canEditMemo(id);if(!_full&&!_memoOnly)return;const oldCur=k.cur;if(_full){k.text=$('#krT').value;readBlock(k,'');if(k.m2)readBlock(k.m2,'2');k.type=$('#krTy').value;k.owners=[...(state.krOwners||[])];delete k.owner;k.period=$('#krPeriod')?.value||'';const _od=k.due||'';const _nd=$('#krDue')?.value||'';k.start=$('#krStart')?.value||'';k.due=_nd;if(_od!==_nd)_dueChg=[_od,_nd];}k.note=$('#krNote')?$('#krNote').value:(k.note||'');state.isNewKr=false;const memo=$('#krMemo')?.value||'';if(oldCur!==k.cur||memo){if(!state.history[id])state.history[id]=[];state.history[id].push({at:nowStamp(),cur:oldCur,newCur:k.cur,by:uById(state.cu)?.name||'-',memo})}if(_dueChg)logAct(id,'due',{from:_dueChg[0]||'미설정',to:_dueChg[1]||'미설정'});if(oldCur!==k.cur)logAct(id,'val',{from:String(oldCur),to:String(k.cur),txt:memo});else if(memo)logAct(id,'memo',{txt:memo});saveS();cloudKrWrite({[id]:KRS[id],...(k.parent&&KRS[k.parent]?{[k.parent]:KRS[k.parent]}:{})},null,{['_history.'+id]:state.history[id]||[]});closeM('mKr');go(location.hash.replace('#','')||'biz')}
function renderKrChips(){const el=$('#krOChips');if(!el)return;const oids=state.krOwners||[];el.innerHTML=oids.length?oids.map(oid=>{const info=ownerInfo(oid);if(!info)return '';return `<span class="owner-chip" style="background:${info.color}1A;color:${info.color};border-color:${info.color}40">${info.type==='group'?'群 ':''}${info.name}<span class="x" onclick="removeKrOwner('${oid}')">×</span></span>`}).join(''):'<span style="color:var(--tx5);font-size:11px;padding:4px 2px">담당자 없음 (그룹/개인 검색해 추가)</span>'}
function renderKrOpts(){const el=$('#krOOpts');if(!el)return;const q=($('#krOSearch')?.value||'').toLowerCase();const cur=state.krOwners||[];const opts=[...Object.entries(TEAMS).map(([id,g])=>({id,name:g.name,type:'group'})),...Object.entries(BIZ).map(([id,b])=>({id:'b_'+id,name:b.name,type:'biz'})),...USERS.map(u=>({id:u.id,name:u.name,type:'user'}))].filter(o=>!cur.includes(o.id)&&o.name.toLowerCase().includes(q));el.innerHTML=opts.length?opts.slice(0,50).map(o=>`<div class="owner-opt" onclick="addKrOwner('${o.id}')">${o.type==='group'?'<span class="g-mark">그룹</span>':''}${o.name}</div>`).join(''):'<div style="padding:8px;font-size:11px;color:var(--tx5)">검색 결과 없음</div>'}
function addKrOwner(oid){if(!state.krOwners)state.krOwners=[];if(state.krOwners.includes(oid))return;state.krOwners.push(oid);if($('#krOSearch'))$('#krOSearch').value='';renderKrChips();renderKrOpts()}
function removeKrOwner(oid){state.krOwners=(state.krOwners||[]).filter(o=>o!==oid);renderKrChips();renderKrOpts()}
const BIZ_PREFIX={exp:'EXP-KR-',lgt:'LGT-KR-',erz:'MKT-KR-',fod:'FOD-KR-'};
function nextKrId(bid){const pfx=BIZ_PREFIX[bid]||(bid.toUpperCase()+'-KR-');let n=1;while(KRS[pfx+n])n++;return pfx+n}
function newKr(bid){const u=uById(state.cu);if(!u||u.role!=='admin'){alert('관리자만');return}const ck=CO.krs.find(x=>x.biz===bid);const id=nextKrId(bid);KRS[id]={biz:bid,text:'',note:'',period:'',cur:0,tgt:100,unit:'%',type:'committed',owners:[],parent:ck?ck.id:'',children:[]};state.isNewKr=true;saveS();openKr(id)}
function nextIkId(bid){const pfx=(BIZ_PREFIX[bid]||(bid.toUpperCase()+'-KR-')).replace('-KR-','-IK-');let n=1;while(KRS[pfx+n])n++;return pfx+n}
function newIK(parentId){const u=uById(state.cu);if(!u||u.role!=='admin'){alert('관리자만');return}const parent=KRS[parentId];if(!parent){alert('상위 KR 없음');return}const bid=parent.biz;const id=nextIkId(bid);KRS[id]={biz:bid,text:'',note:'',period:'',cur:0,tgt:100,unit:'%',type:'committed',owners:[],parent:parentId,children:[]};if(!parent.children)parent.children=[];parent.children.push(id);state.isNewKr=true;state.exp[parentId]=true;saveS();openKr(id)}
function delKr(){const id=state.currentKr;if(!id||!KRS[id])return;const u=uById(state.cu);if(!u||u.role!=='admin'){alert('관리자만 삭제 가능');return}const k0=KRS[id];const kids=KRS[id].children||[];let hist=(state.history[id]||[]).length;kids.forEach(kid=>{hist+=(state.history[kid]||[]).length});if(!confirm('정말 삭제할까요?\n\n['+id+'] '+(k0.text||'')+'\n· 하위 과제 '+kids.length+'개\n· 누적 체크인 기록 '+hist+'개\n\n삭제하면 위 내용이 영구 삭제되며 복구할 수 없습니다.'))return;const _par=KRS[id].parent;kids.forEach(kid=>delete KRS[kid]);Object.values(KRS).forEach(k=>{if(k.children)k.children=k.children.filter(c=>c!==id)});delete KRS[id];saveS();cloudKrWrite(_par&&KRS[_par]?{[_par]:KRS[_par]}:{},[id,...kids]);closeM('mKr');go('biz')}
function editBizObj(bid){const u=uById(state.cu);if(!u||u.role!=='admin'){alert('관리자만');return}state.editObjType='biz';state.editObjBid=bid;$('#mObjT').textContent=`사업 OBJECTIVE — ${BIZ[bid].name}`;$('#objText').value=BIZ[bid].obj;$('#mObj').hidden=false;setTimeout(()=>$('#objText').focus(),50)}
function editCoObj(){const u=uById(state.cu);if(!u||u.role!=='admin'){alert('관리자만');return}state.editObjType='co';$('#mObjT').textContent='전사 OBJECTIVE';$('#objText').value=CO.obj;$('#mObj').hidden=false;setTimeout(()=>$('#objText').focus(),50)}
function openPickParent(bid){const u=uById(state.cu);if(!u||u.role!=='admin'){alert('관리자만');return}const bkrs=Object.entries(KRS).filter(([id,k])=>k.biz===bid&&!id.includes('-IK-')&&!id.includes('-GK-'));if(!bkrs.length){alert('이 사업에 사업 KR이 없습니다. 먼저 사업 KR을 추가해주세요.');return}state.pickParentBid=bid;$('#mPickSub').textContent=BIZ[bid].name;$('#pickParentSel').innerHTML=bkrs.map(([id,k])=>`<option value="${id}">${id} — ${k.text||'(미입력)'}</option>`).join('');$('#mPickParent').hidden=false}
function confirmPickParent(){const pid=$('#pickParentSel').value;if(!pid)return;closeM('mPickParent');newIK(pid)}
function saveObj(){const v=$('#objText').value.trim();if(!v){alert('내용 입력');return}if(state.editObjType==='biz'){BIZ[state.editObjBid].obj=v}else if(state.editObjType==='co'){CO.obj=v}state.editObjType=null;state.editObjBid=null;saveS();cloudMeta();closeM('mObj');go('biz')}
function exportData(){const data={state,KRS,USERS,BIZ,CO,exportedAt:new Date().toISOString(),version:STORE};const json=JSON.stringify(data,null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`okr-backup-${new Date().toISOString().slice(0,10).replace(/-/g,'')}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}
function importData(file){if(!file)return;if(!confirm('현재 데이터를 백업 파일로 덮어씁니다. 계속할까요?'))return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.KRS){Object.keys(KRS).forEach(k=>delete KRS[k]);Object.assign(KRS,d.KRS)}if(d.USERS){USERS.length=0;d.USERS.forEach(u=>USERS.push(u))}if(d.BIZ)Object.assign(BIZ,d.BIZ);if(d.CO)Object.assign(CO,d.CO);if(d.state)Object.assign(state,d.state);saveS();cloudInit();alert('복원 완료 (백업 시점: '+(d.exportedAt||'알 수 없음')+').\n페이지를 새로 로드합니다.');location.reload()}catch(err){alert('복원 실패: '+err.message)}};reader.readAsText(file)}
function closeM(id){if(id==='mTask'&&tDirtyCnt()){if(!confirm('저장하지 않은 변경 '+tDirtyCnt()+'건이 있습니다.\n저장하지 않고 닫을까요?'))return;discardTasks()}if(id==='mKr'&&state.isNewKr){const krId=state.currentKr;if(KRS[krId]){const typed=($('#krT')?.value||'').trim();const hasModel=(KRS[krId].text||'').trim();if(!hasModel&&!typed){delete KRS[krId];Object.values(KRS).forEach(k=>{if(k.children)k.children=k.children.filter(c=>c!==krId)});saveS();go('biz')}else if(!hasModel&&typed){KRS[krId].text=typed;saveS();cloudKrWrite({[krId]:KRS[krId],...(KRS[krId].parent&&KRS[KRS[krId].parent]?{[KRS[krId].parent]:KRS[KRS[krId].parent]}:{})});go(location.hash.replace('#','')||'biz')}}state.isNewKr=false}$('#'+id).hidden=true}

loadS();
if(state.settings&&state.settings.terms)Object.assign(TERMS,state.settings.terms);
$('#userSearch').addEventListener('input',e=>renderUL(e.target.value));
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#loginBtn').addEventListener('click',doLogin);
renderUL();
if(state.cu)showApp();else state.exp['CO-O']=true;
$$('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.v)));
window.addEventListener('hashchange',()=>{if(state.cu){const v=location.hash.replace('#','')||'dash';go(v)}});
Object.assign(window,{go,selU,doLogin,logout,togE,expAll,selRow,openKr,saveKr,closeM,openBizDetail,newUser,openUser,saveUser,delUser,filterUser,openPwChange,closePwChange,savePw,saveSettings});
initCloud();
</script></body></html>
